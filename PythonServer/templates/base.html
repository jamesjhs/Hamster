<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Chocolate's Monitor{% endblock %}</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" href="/icons/icon-192.png">
  <meta name="theme-color" content="#923717">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Hamster">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <link rel="stylesheet" href="/css/styles.css">
  <style>.gallery-img{transition:transform .2s}.gallery-img:hover{transform:scale(1.04)}</style>
  {% block head %}{% endblock %}
</head>
<body class="bg-hamster-50 text-hamster-900 min-h-screen flex flex-col">
  <nav class="bg-hamster-800 text-white shadow-lg" style="position:relative">
    <div class="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between">
      <a href="/" class="flex items-center gap-2 text-xl font-bold hover:text-hamster-200 transition-colors">
        <span>🐹</span><span>Chocolate's Monitor</span>
      </a>
      <div id="navLinks" class="flex gap-6 text-sm font-medium" style="display:none">
        <a href="/" class="hover:text-hamster-200 transition-colors">Home</a>
        <a href="/analytics" class="hover:text-hamster-200 transition-colors">Analytics</a>
        <a href="/gallery" class="hover:text-hamster-200 transition-colors">Gallery</a>
        <a href="/live-status" class="hover:text-hamster-200 transition-colors">Live</a>
        <a href="/blog" class="hover:text-hamster-200 transition-colors">Blog</a>
        <a href="/kindle" class="hover:text-hamster-200 transition-colors">Kindle</a>
        <button type="button" data-install-app hidden
                style="background:rgba(255,255,255,0.14);border:1px solid rgba(255,255,255,0.25);cursor:pointer;padding:8px 12px;border-radius:999px;color:inherit;font:inherit">
          Install app
        </button>
      </div>
      <button id="navToggle" aria-label="Toggle menu"
              style="background:none;border:none;cursor:pointer;padding:6px;border-radius:6px;color:inherit">
        <svg id="navIconHam" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
          <line x1="3" y1="6" x2="21" y2="6"/>
          <line x1="3" y1="12" x2="21" y2="12"/>
          <line x1="3" y1="18" x2="21" y2="18"/>
        </svg>
        <svg id="navIconX" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24" style="display:none">
          <line x1="18" y1="6" x2="6" y2="18"/>
          <line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
    </div>
    <div id="mobileMenu" style="display:none;background:#782f16;border-top:1px solid rgba(255,255,255,0.15)">
      <div class="max-w-6xl mx-auto px-4 py-2" style="display:flex;flex-direction:column;gap:2px">
        <a href="/" style="display:block;padding:10px 8px;border-radius:6px;font-size:.875rem;font-weight:500;color:inherit;text-decoration:none">Home</a>
        <a href="/analytics" style="display:block;padding:10px 8px;border-radius:6px;font-size:.875rem;font-weight:500;color:inherit;text-decoration:none">Analytics</a>
        <a href="/gallery" style="display:block;padding:10px 8px;border-radius:6px;font-size:.875rem;font-weight:500;color:inherit;text-decoration:none">Gallery</a>
        <a href="/live-status" style="display:block;padding:10px 8px;border-radius:6px;font-size:.875rem;font-weight:500;color:inherit;text-decoration:none">Live</a>
        <a href="/blog" style="display:block;padding:10px 8px;border-radius:6px;font-size:.875rem;font-weight:500;color:inherit;text-decoration:none">Blog</a>
        <a href="/kindle" style="display:block;padding:10px 8px;border-radius:6px;font-size:.875rem;font-weight:500;color:inherit;text-decoration:none">Kindle</a>
        <button type="button" data-install-app hidden
                style="margin-top:8px;background:rgba(255,255,255,0.12);border:1px solid rgba(255,255,255,0.25);cursor:pointer;padding:10px 8px;border-radius:6px;color:inherit;font:inherit;text-align:left">
          Install app
        </button>
      </div>
    </div>
  </nav>
  <main class="max-w-6xl mx-auto px-4 py-8 flex-1 w-full">
    {% block content %}{% endblock %}
  </main>
  <footer class="bg-hamster-800 text-hamster-200 text-center text-xs py-3 mt-auto">
    Chocolate &bull; Russian Dwarf Hamster &bull; hamster.jahosi.co.uk &bull; v{{ service_version }}
  </footer>
  <script src="/js/app.js"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
